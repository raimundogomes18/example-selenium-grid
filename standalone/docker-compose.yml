services:
  browser:
    hostname: ${SELENIUM_ADDRESS}
    image: selenium/standalone-chrome:4.18.1
    shm_size: 1gb
    env_file:
      - .env
    ports:
      - ${SELENIUM_PORT}:4444
      - ${NO_VNC_PORT}:7900
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
  calculator:
    extends:
      file: ../docker-compose-shared-calculator.yml
      service: calculator
  maven:
    extends:
      file: ../docker-compose-shared-calculator.yml
      service: maven
    environment:
     DEFAULT_BROWSER: "chrome"
    depends_on:
      browser:
        condition: service_healthy
      calculator:
        condition: service_started   
volumes:
  m2_repository:  
    name: m2_repository
    external: true  

        
