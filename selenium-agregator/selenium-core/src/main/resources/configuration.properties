# Navegador padrao para execucao local (chrome, firefox, MicrosoftEdge)
default.browser=chrome

# Define se os testes serao executados via Selenium Grid remoto.
# Use "false" para rodar localmente pela IDE.
# Use "true" quando executando via Docker (o Docker ja configura REMOTE_EXECUTION=true via variavel de ambiente).
remote.execution=false

# URL do Selenium Grid -- usada quando remote.execution=true.
# Em Docker, esta propriedade e sobrescrita pela variavel de ambiente REMOTE_URL.
# Para execucao local apontando para um Grid, ajuste o endereco abaixo:
#remote.url=http://hub:4444
remote.url=http://localhost:4444

# URL da aplicacao sob teste
app.url.local=http://localhost:3000
app.url.remote=http://calculator:3000

# Execucao em modo headless (sem janela do navegador)
headless=false
