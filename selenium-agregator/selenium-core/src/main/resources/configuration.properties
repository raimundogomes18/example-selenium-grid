# Navegador padrão para execução local (chrome, firefox, MicrosoftEdge)
default.browser=chrome

# Define se os testes serão executados via Selenium Grid remoto.
# Use "false" para rodar localmente pela IDE.
# Use "true" quando executando via Docker (o Docker já configura REMOTE_EXECUTION=true via variável de ambiente).
remote.execution=false

# URL do Selenium Grid — usada quando remote.execution=true.
# Em Docker, esta propriedade é sobrescrita pela variável de ambiente REMOTE_URL.
# Para execução local apontando para um Grid, ajuste o endereço abaixo:
#remote.url=http://hub:4444
remote.url=http://localhost:4444

# URL da aplicação sob teste
app.url.local=http://localhost:3000
app.url.remote=http://calculator:3000

# Execução em modo headless (sem janela do navegador)
headless=false
